    <style>

            align-items: center;

            border: 1px solid #e5e7eb;
            text-align: center;
        }
        
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e5e7eb;
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        h1 {
            color: #111827;
            margin: 0 0 12px 0;
            font-size: 24px;
            font-weight: 600;
        }
        
        .subtitle {
            color: #6b7280;
            margin-bottom: 32px;
            font-size: 15px;
        }
        
        .success-icon {
            width: 32px;
            height: 32px;
            margin: 0 auto 24px auto;
            background: #10b981;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .error-icon {
            width: 32px;
            height: 32px;
            margin: 0 auto 24px auto;
            background: #ef4444;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .back-button {
            display: inline-block;
            padding: 12px 24px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            margin-top: 16px;
        }
        
        .back-button:hover {
            background: #2563eb;
        }
        
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
<script>

<body>
    <div class="container">
        <div id="loadingState">
            <div class="spinner"></div>
            <h1>Processing Your Login</h1>
            <p class="subtitle">Completing your Google sign-in...</p>
        </div>
        
        <div id="successState" style="display: none;">
            <div class="success-icon" style="display: flex;">
                <svg width="18" height="18" fill="white" viewBox="0 0 24 24">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
            </div>
            <h1 class="success">Welcome Back!</h1>
            <p class="subtitle">Redirecting to your dashboard...</p>
        </div>
        
        <div id="errorState" style="display: none;">
            <div class="error-icon" style="display: flex;">
                <svg width="18" height="18" fill="white" viewBox="0 0 24 24">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </div>
            <h1 class="error">Login Processing Failed</h1>
            <p class="subtitle" id="errorMessage">We couldn't complete your Google sign-in.</p>
            <a href="https://unlimited-leads.online/login" class="back-button">Back to Login</a>
        </div>
    </div>

    <script>
        const WORKER_URL = 'https://login-v2.hamoureliasse.workers.dev/';
        
        // FIX: renamed from 'supabase' to 'supabaseClient' to avoid duplicate declaration conflict
        const supabaseClient = window.supabase.createClient(
            'https://snxhsboboatjywgwdeds.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGhzYm9ib2F0anl3Z3dkZWRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYwMTY5NzgsImV4cCI6MjA2MTU5Mjk3OH0.qkoiXJoqujQ4iUByOqSAsacuJVtJx32j19PTuy7brMo'
        );

        function showSuccess() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'none';
            document.getElementById('successState').style.display = 'block';
        }

        function showError(message) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('successState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            document.getElementById('errorMessage').textContent = message;
        }

        async function sendEmailToServer(email) {
            try {
                console.log('📤 Sending email to server:', email);
                
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        provider: 'google',
                        type: 'login'
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const serverData = await response.json();
                console.log('✅ Server response:', serverData);

                if (serverData.token) {
                    return { success: true, token: serverData.token };
                } else {
                    throw new Error('No token received from server');
                }
                
            } catch (error) {
                console.error('❌ Server error:', error);
                return { success: false, error: error.message };
            }
        }

        async function processGoogleLogin() {
            try {
                console.log('🚀 Processing Google login...');
                
                // FIX: using supabaseClient instead of supabase
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                
                if (error) {
                    throw new Error('Failed to get Google session: ' + error.message);
                }
                
                if (!session || !session.user) {
                    throw new Error('No Google session found');
                }
                
                const email = session.user.email;
                if (!email) {
                    throw new Error('No email found in Google account');
                }
                
                console.log('📧 Got email from Google:', email);
                
                const result = await sendEmailToServer(email);
                
                if (result.success) {
                    console.log('🎫 Got server token:', result.token);
                    showSuccess();
                    
                    // FIX: using supabaseClient instead of supabase
                    await supabaseClient.auth.signOut();
                    
                    setTimeout(() => {
                        window.location.href = `https://unlimited-leads.online/app?token=${result.token}`;
                    }, 1500);
                } else {
                    showError('Failed to get login token from server.');
                }
                
            } catch (error) {
                console.error('❌ Google login processing error:', error);
                showError(error.message);
            }
        }

        window.addEventListener('load', () => {
            console.log('🔍 Page loaded, checking for Google session...');
            setTimeout(() => {
                processGoogleLogin();
            }, 1000);
        });

        setTimeout(() => {
            const loadingState = document.getElementById('loadingState');
            if (loadingState.style.display !== 'none') {
                showError('Login processing timed out. Please try again.');
            }
        }, 15000);
    </script>
</body>
</html>
