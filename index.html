<!--
  PASTE THIS ENTIRE <script> BLOCK just before the closing </body> tag
  on unlimited-leads.online/index.html
  (after the n8n chat div, before </body>)
-->

<script>
(function() {

  // ── 1. CTA CLICKS — every sign-up and pricing button ──────────────────
  document.querySelectorAll('a[href*="sign-up"], a[href*="sign_up"]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      try {
        posthog.capture('cta_clicked', {
          cta_text: btn.textContent.trim(),
          cta_href: btn.href,
          cta_location: getSection(btn),
          page: window.location.pathname
        });
      } catch(e) {}
    });
  });

  // ── 2. PRICING PAGE CLICKS ────────────────────────────────────────────
  document.querySelectorAll('a[href*="pricing"]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      try {
        posthog.capture('pricing_clicked', {
          source_location: getSection(btn),
          page: window.location.pathname
        });
      } catch(e) {}
    });
  });

  // ── 3. LOGIN CLICKS ───────────────────────────────────────────────────
  document.querySelectorAll('a[href*="login"], a[href*="log-in"]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      try {
        posthog.capture('login_clicked', { page: window.location.pathname });
      } catch(e) {}
    });
  });

  // ── 4. FAQ INTERACTIONS ───────────────────────────────────────────────
  document.querySelectorAll('.faq-question').forEach(function(question) {
    question.addEventListener('click', function() {
      var faqItem = question.parentElement;
      var isOpening = !faqItem.classList.contains('active');
      var questionText = question.querySelector('span') ? question.querySelector('span').textContent.trim() : question.textContent.trim();
      try {
        posthog.capture('faq_clicked', {
          question: questionText,
          action: isOpening ? 'opened' : 'closed',
          page: window.location.pathname
        });
      } catch(e) {}
    });
  });

  // ── 5. SCROLL DEPTH ───────────────────────────────────────────────────
  var scrollDepths = [25, 50, 75, 90, 100];
  var firedDepths = {};
  window.addEventListener('scroll', function() {
    var scrolled = (window.scrollY + window.innerHeight) / document.documentElement.scrollHeight * 100;
    scrollDepths.forEach(function(depth) {
      if (scrolled >= depth && !firedDepths[depth]) {
        firedDepths[depth] = true;
        try {
          posthog.capture('scroll_depth', {
            depth_percent: depth,
            page: window.location.pathname
          });
        } catch(e) {}
      }
    });
  }, { passive: true });

  // ── 6. SECTION VIEWS (Intersection Observer) ──────────────────────────
  var sections = [
    { el: document.querySelector('.hero'),              name: 'hero' },
    { el: document.querySelector('.everything-needed'), name: 'features' },
    { el: document.querySelector('.product-showcase'),  name: 'product_showcase' },
    { el: document.querySelector('.tools-suite'),       name: 'tools_suite' },
    { el: document.querySelector('.faq-section'),       name: 'faq' },
    { el: document.querySelector('.testimonials-section'), name: 'testimonials' },
    { el: document.querySelector('.final-cta'),         name: 'final_cta' },
  ];
  var viewedSections = {};
  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting && !viewedSections[entry.target.dataset.section]) {
          viewedSections[entry.target.dataset.section] = true;
          try {
            posthog.capture('section_viewed', {
              section: entry.target.dataset.section,
              page: window.location.pathname
            });
          } catch(e) {}
        }
      });
    }, { threshold: 0.3 });

    sections.forEach(function(s) {
      if (s.el) {
        s.el.dataset.section = s.name;
        observer.observe(s.el);
      }
    });
  }

  // ── 7. TIME ON PAGE ───────────────────────────────────────────────────
  var pageStartTime = Date.now();
  var timeFired = {};
  var timeThresholds = [30, 60, 120, 180]; // seconds
  var timeInterval = setInterval(function() {
    var elapsed = Math.floor((Date.now() - pageStartTime) / 1000);
    timeThresholds.forEach(function(t) {
      if (elapsed >= t && !timeFired[t]) {
        timeFired[t] = true;
        try {
          posthog.capture('time_on_page', {
            seconds: t,
            page: window.location.pathname
          });
        } catch(e) {}
      }
    });
    if (timeFired[180]) clearInterval(timeInterval);
  }, 5000);

  // ── 8. PAGE LEAVE — capture time before unload ────────────────────────
  window.addEventListener('beforeunload', function() {
    var timeSpent = Math.floor((Date.now() - pageStartTime) / 1000);
    try {
      posthog.capture('page_exit', {
        time_spent_seconds: timeSpent,
        page: window.location.pathname,
        max_scroll_depth: Math.max.apply(null, Object.keys(firedDepths).map(Number).concat([0]))
      });
    } catch(e) {}
  });

  // ── 9. NAV LINK CLICKS ────────────────────────────────────────────────
  document.querySelectorAll('.nav-link').forEach(function(link) {
    link.addEventListener('click', function() {
      try {
        posthog.capture('nav_clicked', {
          link_text: link.textContent.trim(),
          link_href: link.getAttribute('href'),
          page: window.location.pathname
        });
      } catch(e) {}
    });
  });

  // ── 10. HERO STATS VISIBILITY ─────────────────────────────────────────
  var statsEl = document.querySelector('.stats');
  if (statsEl && 'IntersectionObserver' in window) {
    var statsObserver = new IntersectionObserver(function(entries) {
      if (entries[0].isIntersecting) {
        try {
          posthog.capture('stats_section_viewed', { page: window.location.pathname });
        } catch(e) {}
        statsObserver.disconnect();
      }
    }, { threshold: 0.5 });
    statsObserver.observe(statsEl);
  }

  // ── HELPER: get section name from element ─────────────────────────────
  function getSection(el) {
    var section = el.closest('section, header, .hero, .final-cta, .limited-offer');
    if (!section) return 'unknown';
    if (section.classList.contains('hero')) return 'hero';
    if (section.classList.contains('final-cta')) return 'final_cta';
    if (section.classList.contains('everything-needed')) return 'features';
    if (section.classList.contains('tools-suite')) return 'tools_suite';
    if (section.classList.contains('testimonials-section')) return 'testimonials';
    if (section.classList.contains('limited-offer')) return 'banner';
    if (section.tagName === 'HEADER') return 'header';
    return section.id || section.className.split(' ')[0] || 'unknown';
  }

})();
</script>
